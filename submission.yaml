name: ple-clausegate-mirrorir
model_api: google-cloud/gemini-4-argon
install: >-
  if sh -c 'uv --version' >/dev/null 2>&1; then
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt;
  else
  python3 -m venv --copies --without-pip /opt/harness/venv
  && curl -fsSL https://bootstrap.pypa.io/get-pip.py | /opt/harness/venv/bin/python - --no-cache-dir --disable-pip-version-check
  && /opt/harness/venv/bin/pip install --no-cache-dir -r {src}/requirements.txt;
  fi
serve: /opt/harness/venv/bin/python {src}/serve.py
env:
  COMPACT_AT_TOKENS: "150000"
